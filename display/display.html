<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Visitor Dashboard</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 50px; background: #1e1e2f; color: white; }
    .card { background: #2a2a40; padding: 40px; border-radius: 12px; display: inline-block; min-width: 300px; }
    #count { font-size: 96px; font-weight: bold; color: #00d4ff; margin: 20px 0; }
  </style>
</head>
<body>
  <div class="card">
    <h2>LIVE VISITOR COUNT</h2>
    <div id="count">--</div>
    <p>Auto-updating from AWS DynamoDB</p>
  </div>

  <script>
    const API_URL = 'https://wqn4u6ul49.execute-api.us-east-1.amazonaws.com/visitor';

    async function fetchCount() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        document.getElementById('count').innerText = data.count;
      } catch (err) {
        console.error('Failed to fetch count:', err);
      }
    }

    // Fetch immediately on load, then poll every 2 seconds
    fetchCount();
    setInterval(fetchCount, 2000);
  </script>
</body>
</html>
